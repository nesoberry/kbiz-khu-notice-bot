name: Scholarship Bot Scheduler

on:
  schedule:
    - cron: '0 * * * *' # 매시간 정각마다 실행하라는 뜻이야!
  workflow_dispatch: # 우리가 원할 때 수동으로 버튼을 누를 수 있게 해주는 기능

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 내 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 파이썬 부품(라이브러리) 설치
        run: pip install requests beautifulsoup4

      - name: 봇 실행하기!
        run: python bot.py

      - name: 봇이 확인한 새 글 번호 메모장에 저장하고 덮어쓰기
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add last_post_id.txt
          git commit -m "봇 기억 업데이트" || echo "새로운 글이 없어서 업데이트 안함"
          git push
